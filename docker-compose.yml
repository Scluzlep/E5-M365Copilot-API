services:
  m365copilot2api:
    image: ghcr.io/scluzlep/m365copilot2api:latest
    container_name: m365copilot2api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Map the sessions directory to the host for persistence
      - ./sessions:/app/sessions
      - ./accounts.json:/app/accounts.json
    restart: unless-stopped
