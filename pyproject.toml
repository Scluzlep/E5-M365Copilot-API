[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "e5-m365-copilot-api"
version = "1.0.0"
description = "Enterprise-Grade Substrate Bridge & Dual-Protocol Gateway for Microsoft 365 Copilot / E5"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Scluzlep" }
]
keywords = ["m365", "copilot", "e5", "openai", "claude", "anthropic", "proxy"]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "requests>=2.31.0",
    "httpx[socks]>=0.27.0",
    "playwright>=1.40.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
m365-copilot-api = "app:main"

[tool.hatch.build.targets.wheel]
packages = ["copilot", "server"]
